          - text
          - image

      - id: codex/gpt-5.5
        name: GPT-5.5 · Codex
        api: openai-responses
        reasoning: true
        thinking:
          mode: effort
          efforts:
            - low
            - medium
            - high
            - xhigh
        contextWindow: 272000
        maxTokens: 128000
        input:
          - text
          - image

      - id: group/smart-split
        name: 难题给强模型，简单的给便宜模型 · routing group
        reasoning: true
        thinking:
          mode: effort
          efforts:
            - low
            - medium
            - high
