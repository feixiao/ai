providers:
  # 1. 本地 Magpie 网关 (多模型动态路由 / Gemini 3.8 / GPT-6 Luna / GPT-5.6 / 本地端侧量化模型)
  magpie:
    baseUrl: http://127.0.0.1:3425/v1
    api: openai-completions
    auth: none
    headers:
      User-Agent: omp
    compat:
      promptCacheSessionHeader: x-session-affinity
    models:
      - id: antigravity/gemini-3.8-flash
        name: Gemini 3.8 Flash · Antigravity
        reasoning: true
        thinking:
          mode: effort
          efforts:
            - low
            - medium
            - high
        contextWindow: 1048576
        maxTokens: 65536
        input:
          - text
          - image

      - id: codex/gpt-6-luna
        name: GPT-6-Luna · Codex
        api: openai-responses
        reasoning: true
        thinking:
          mode: effort
          efforts:
            - low
            - medium
            - high
            - xhigh
            - max
        contextWindow: 272000
        maxTokens: 128000
        input:
          - text
          - image

      - id: codex/gpt-5.6-terra
        name: GPT-5.6-Terra · Codex
        api: openai-responses
        reasoning: true
        thinking:
          mode: effort
          efforts:
            - low
            - medium
            - high
            - xhigh
            - max
        contextWindow: 272000
        maxTokens: 128000
        input:
          - text
          - image

      - id: codex/gpt-5.6-luna
        name: GPT-5.6-Luna · Codex
        api: openai-responses
        reasoning: true
        thinking:
          mode: effort
          efforts:
            - low
            - medium
            - high
            - xhigh
            - max
        contextWindow: 272000
        maxTokens: 128000
