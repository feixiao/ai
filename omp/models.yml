providers:
  # 1. 本地 Magpie 网关 (多模型动态路由 / Gemini 3.8 / GPT-6 / Claude Opus)
  magpie:
    baseUrl: http://127.0.0.1:3425/v1
    api: openai-completions
    auth: none
    headers:
      User-Agent: omp
    models:
      - id: antigravity/gemini-3.8-flash
        name: Gemini 3.8 Flash · Antigravity
        api: openai-responses
        reasoning: true
        thinking:
          mode: effort
          efforts:
            - low
            - medium
            - high
        contextWindow: 1048576
        maxTokens: 65536
        input:
          - text
          - image
      - id: antigravity/claude-opus-4-6-thinking
        name: Claude Opus 4.6 Thinking · Antigravity
        api: openai-responses
        reasoning: true
        contextWindow: 256000
        maxTokens: 65536
        input:
          - text
          - image
      - id: codex/gpt-6-astra
        name: GPT-6-Astra · Codex
        api: openai-responses
        reasoning: true
        thinking:
          mode: effort
          efforts:
            - low
            - medium
            - high
            - xhigh
            - max
        contextWindow: 272000
        maxTokens: 128000
        input:
          - text
          - image
      - id: codex/gpt-6-sol
        name: GPT-6-Sol · Codex
        api: openai-responses
        reasoning: true
        thinking:
          mode: effort
          efforts:
            - low
            - medium
            - high
            - xhigh
            - max
        contextWindow: 272000
        maxTokens: 128000
        input:
          - text
          - image

  # 2. 本地 LM Studio (Mac Studio 128GB 本地端侧推理)
  lmstudio:
    baseUrl: http://127.0.0.1:1234/v1
    api: openai-completions
    auth: none
    models:
      - id: deepseek-r1-qwen-32b
        name: DeepSeek-R1-Distill-Qwen-32B (Local LM Studio)
        reasoning: true
        contextWindow: 65536
        maxTokens: 16384
        input:
          - text
      - id: qwen2.5-coder-32b-instruct
        name: Qwen 2.5 Coder 32B (Local LM Studio)
        reasoning: false
        contextWindow: 65536
        maxTokens: 16384
        input:
          - text

  # 3. 本地 Ollama (GPU/Metal 加速推理)
  ollama:
    baseUrl: http://127.0.0.1:11434/v1
    api: openai-completions
    auth: none
    models:
      - id: deepseek-r1:14b
        name: DeepSeek R1 14B (Local Ollama)
        reasoning: true
        contextWindow: 32768
        maxTokens: 8192
        input:
          - text
      - id: qwen2.5-coder:14b
        name: Qwen 2.5 Coder 14B (Local Ollama)
        reasoning: false
        contextWindow: 32768
        maxTokens: 8192
        input:
          - text
